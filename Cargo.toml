[package]
name = "suntray"
version = "0.1.0"
edition = "2021"
description = "A small cross-platform SunSynk energy monitor"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
gpui-kit = "0.6"
gpui-component-macros = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui-tray = "0.1"
keyring = "4.2"
md-5 = "0.10"
rsa = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.packager]
product-name = "SunTray"
identifier = "com.suntray.app"
publisher = "SunTray"
formats = ["default"]
out-dir = "./dist"

[[package.metadata.packager.binaries]]
path = "suntray"
main = true

[package.metadata.packager.macos]
background-app = true
minimum-system-version = "13.0"
info-plist-path = "packaging/macos/Info.plist"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
compression = "lzma"
appdata-paths = ["$LOCALAPPDATA/$PUBLISHER/$PRODUCTNAME"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
gpui-tray = { path = "vendor/gpui-tray" }
