[package]
name = "suntray"
version = "0.1.0"
edition = "2021"
description = "A small cross-platform SunSynk energy monitor"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
gpui = { version = "0.2.2" }
gpui-component = { version = "0.5.1" }
gpui-component-assets = { version = "0.5.1" }
gpui-component-macros = "0.5.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui-tray = "0.1"
keyring = "4.2"
md-5 = "0.10"
rsa = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
gpui-tray = { path = "vendor/gpui-tray" }
