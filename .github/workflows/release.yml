name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set release version
        run: bash packaging/set-version.sh "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install NSIS
        run: choco install -y nsis
        shell: pwsh

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
        shell: pwsh

      - name: Build NSIS installer
        run: cargo packager --release --target x86_64-pc-windows-msvc
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Package portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path dist\portable | Out-Null
          $binary = "target\x86_64-pc-windows-msvc\release\suntray.exe"
          if (-not (Test-Path $binary)) {
            throw "Release binary not found: $binary"
          }
          Copy-Item $binary dist\portable\SunTray.exe
          Compress-Archive -Path dist\portable\SunTray.exe -DestinationPath dist\SunTray-${{ github.ref_name }}-windows-x64-portable.zip
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SunTray-windows-x64-${{ github.ref_name }}
          path: |
            dist/SunTray-${{ github.ref_name }}-windows-x64-portable.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set release version
        run: bash packaging/set-version.sh "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build macOS DMG
        run: cargo packager --release --target aarch64-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SunTray-macos-arm64-${{ github.ref_name }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: SunTray ${{ github.ref_name }}
          files: |
            dist/SunTray-${{ github.ref_name }}-windows-x64-portable.zip
            dist/*-setup.exe
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
