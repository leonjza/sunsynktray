name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set release version
        run: bash packaging/set-version.sh "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install NSIS
        run: choco install -y nsis
        shell: pwsh

      - name: Check Windows build
        run: cargo check --target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build NSIS installer
        run: cargo packager --release --target x86_64-pc-windows-msvc
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Package portable ZIP
        run: |
          New-Item -ItemType Directory -Force -Path dist\portable | Out-Null
          $binary = "target\x86_64-pc-windows-msvc\release\suntray.exe"
          if (-not (Test-Path $binary)) {
            throw "Release binary not found: $binary"
          }
          Copy-Item $binary dist\portable\SunTray.exe
          Compress-Archive -Path dist\portable\SunTray.exe -DestinationPath dist\SunTray-${{ github.ref_name }}-windows-x64-portable.zip
        shell: pwsh

      - name: Verify Windows packages
        run: |
          $setup = Get-ChildItem dist -Filter "*-setup.exe" -File
          if ($setup.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($setup.Count)"
          }
          $zip = Get-ChildItem dist -Filter "*-windows-x64-portable.zip" -File
          if ($zip.Count -ne 1) {
            throw "Expected exactly one portable ZIP, found $($zip.Count)"
          }
          $verify = Join-Path $env:RUNNER_TEMP "suntray-portable-verify"
          if (Test-Path $verify) { Remove-Item -Recurse -Force $verify }
          Expand-Archive -Path $zip.FullName -DestinationPath $verify
          if (-not (Test-Path (Join-Path $verify "SunTray.exe"))) {
            throw "Portable ZIP does not contain SunTray.exe"
          }
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SunTray-windows-x64-${{ github.ref_name }}
          path: |
            dist/SunTray-${{ github.ref_name }}-windows-x64-portable.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set release version
        run: bash packaging/set-version.sh "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build macOS app bundle
        run: cargo packager --release --target aarch64-apple-darwin --formats app

      - name: Ad-hoc sign macOS app bundle
        run: codesign --force --deep --sign - --timestamp=none dist/SunTray.app

      - name: Build macOS PKG installer
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkgbuild \
            --component dist/SunTray.app \
            --identifier com.suntray.app \
            --version "$version" \
            --install-location /Applications \
            "dist/SunTray-${version}-macos-arm64.pkg"

      - name: Verify macOS packages
        run: |
          test -x dist/SunTray.app/Contents/MacOS/suntray
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/SunTray.app/Contents/Info.plist | grep -qx 'com.suntray.app'
          pkgutil --payload-files "dist/SunTray-${GITHUB_REF_NAME#v}-macos-arm64.pkg" | grep -qx './Applications/SunTray.app/Contents/MacOS/suntray'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SunTray-macos-arm64-${{ github.ref_name }}
          path: dist/*.pkg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: SunTray ${{ github.ref_name }}
          files: |
            dist/SunTray-${{ github.ref_name }}-windows-x64-portable.zip
            dist/*-setup.exe
            dist/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
